name: Verificação da Central de IA
on:
  pull_request:
    paths:
      - 'cloud-backend/**'
      - 'central-ia.js'
      - 'ai-assistant.js'
      - 'manifest.json'
      - 'test-extension.mjs'
      - 'conversation-reader.js'
      - 'target.js'
      - 'templates.js'
      - 'test-conversation.mjs'
      - 'central-ia.html'
      - 'index.html'
      - '.github/workflows/central-ia-ci.yml'
  push:
    branches: ['main', 'fix/vercel-404-homepage']
    paths:
      - 'cloud-backend/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: cloud-backend
        run: npm install --ignore-scripts
      - name: Syntax
        working-directory: cloud-backend
        run: |
          node --check api/index.mjs
          node --check api/storage.mjs
          node --check api/auth.mjs
          node --check admin/app.js
          node --check ../central-ia.js
      - name: Verificação da extensão instalada (sem chaves)
        run: |
          node --check ai-assistant.js
          node --check conversation-reader.js
          node --check target.js
          node --check templates.js
          node --test test-extension.mjs test-conversation.mjs
      - name: Security and HTTP smoke tests (no real keys)
        working-directory: cloud-backend
        run: npm test
