name: Verificação da Central de IA
on:
  pull_request:
    paths:
      - 'cloud-backend/**'
      - '.github/workflows/central-ia-ci.yml'
  push:
    branches: ['feature/freellmapi-central-1-4-3']
    paths:
      - 'cloud-backend/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: cloud-backend
        run: npm install --ignore-scripts
      - name: Syntax
        working-directory: cloud-backend
        run: |
          node --check api/index.mjs
          node --check api/storage.mjs
      - name: Security and HTTP smoke tests (no real keys)
        working-directory: cloud-backend
        run: npm test
