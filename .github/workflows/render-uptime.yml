name: Verificação do FreeLLMAPI na Render

on:
  schedule:
    # A Render Free hiberna após 15 minutos sem tráfego. Verificação leve a cada 5 minutos.
    # Minutos deslocados do início da hora para reduzir atrasos do GitHub Actions.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sra-luck-render-uptime
  cancel-in-progress: false

jobs:
  check:
    name: HTTP healthcheck (sem credenciais)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Consultar endpoint de saúde público
        shell: bash
        env:
          HEALTH_URL: https://sra-luck-freellmapi.onrender.com/api/ping
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Não acessa modelos, banco, painel administrativo nem API com token.
          status="$(curl -sS -L             --connect-timeout 15             --max-time 100             --retry 1 --retry-delay 8 --retry-all-errors             -o "$response_file" -w '%{http_code}' "$HEALTH_URL")"

          if [ "$status" != "200" ]; then
            echo "::error::Render respondeu HTTP $status ao healthcheck."
            exit 1
          fi

          node -e '
            const fs=require("fs");
            const response=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(response.status!=="ok"){console.error("Healthcheck retornou status inválido.");process.exit(1)}
            console.log("FreeLLMAPI respondeu status=ok.");
          ' "$response_file"
          echo "Healthcheck: FreeLLMAPI respondeu corretamente." >> "$GITHUB_STEP_SUMMARY"
